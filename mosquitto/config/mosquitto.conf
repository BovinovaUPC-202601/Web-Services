# VacApp local Mosquitto config (development / demo).
#
# Anonymous access is enabled to keep the ESP32 firmware and the Python
# simulator simple during development. For production the docx requires
# MQTT over TLS with authenticated devices (RNF security) — see README.

listener 1883
allow_anonymous true

# Optional WebSocket listener (handy for browser-based MQTT inspectors).
listener 9001
protocol websockets

persistence true
persistence_location /mosquitto/data/
log_dest stdout
