# VacApp Mosquitto config.
#
# Local development uses the anonymous 1883 listener below.
# The deployed broker (Mosquitto on an Azure VM) MUST use the TLS 8883 listener
# with authentication — see the TLS section at the bottom and MQTT_README.

# ---- Local development (plain, anonymous) ----
listener 1883
allow_anonymous true

# Optional WebSocket listener (handy for browser-based MQTT inspectors).
listener 9001
protocol websockets

persistence true
persistence_location /mosquitto/data/
log_dest stdout

# ---- Deployed (Azure VM) — MQTT over TLS, authenticated ----
# Uncomment on the VM and remove the anonymous 1883 listener above.
#
# listener 8883
# allow_anonymous false
# password_file /mosquitto/config/passwd
# cafile   /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile  /mosquitto/config/certs/server.key
#
# Create the user with:
#   mosquitto_passwd -c /mosquitto/config/passwd vacapp
